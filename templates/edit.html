{% extends "base.html" %}
{% block title %}Edit Item - Restaurant Menu Manager{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Edit Menu Item</h1>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">← Back to Menu</a>
</div>

<div class="form-container">
    <form method="POST" action="{{ url_for('edit_item', item_id=item.id) }}">

        <div class="form-group">
            <label for="name">Item Name *</label>
            <input type="text" id="name" name="name"
                   value="{{ item.name }}" required>
        </div>

        <div class="form-group">
            <label for="category">Category *</label>
            <select id="category" name="category" required>
                {% for cat in categories %}
                    <option value="{{ cat }}" {% if item.category == cat %}selected{% endif %}>
                        {{ cat }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description">{{ item.description or '' }}</textarea>
        </div>

        <div class="form-group">
            <label for="price">Price ($) *</label>
            <input type="number" id="price" name="price"
                   value="{{ item.price }}" step="0.01" min="0" required>
        </div>

        <div class="form-group form-check">
            <input type="checkbox" id="available" name="available"
                   {% if item.available %}checked{% endif %}>
            <label for="available">Available on menu</label>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
        </div>

    </form>
</div>
{% endblock %}
